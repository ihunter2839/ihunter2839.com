        <image id="backgroundImage" width="1662" height="1125" x="0" y="0"></image>

        </image>
    </svg>

<div id="loader" class="loader">
</div>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', (event) => {
        let backgroundImage = document.getElementById("backgroundImage")
        //wait until the image has loaded to trigger animation
        backgroundImage.addEventListener("load", (event) => {
            const loader = document.getElementById('loader')
            window.setTimeout(() => {
                loader.addEventListener('animationend', (event) => {
                    console.log('animation ended')
                    loader.style.display = 'none'
                })
                loader.animate([
                    { opacity: 1 },
                    { opacity: 0 },
                ], {
                    duration: 1000,
                    easing: "ease-out",
                    iterations: 1,
                    fill: "forwards",
                })
                window.setTimeout(() => {
                    loader.style.display = 'none'
                }, 1000)
            }, 2000)
        })
        backgroundImage.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '/img/b2.png')
    })
</script>
