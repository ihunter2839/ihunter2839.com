<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Ubuntu" rel="stylesheet">

    <!-- Site CSS -->

</head>

<body style="margin: 0;">
    <div
    style="display: flex; flex-direction: row; justify-content: space-around; position: fixed; left: 0; right: 0; top: 0; z-index: 1000; height: 2rem; background: rgb(0,0,0);">
    <a class="headerLink" href="/%20/about.html">about</a>
    <a class="headerLink" href="/%20/words.html">words</a>
    <a class="headerLink" href="/%20/projects.html">projects</a>
    <a class="headerLink" href="/%20/index.html">home</a>
</div>

    <div style="height: 100vh; padding: 0; overflow: scroll; position: relative">
    <svg width="100vw" height="100vh" preserveAspectRatio="xMidYMid">
        <image id="backgroundImage" width="100vw" x="0" y="0"></image>
        <a xlink:href="/%20/img/brutal.gif" target="_blank">
            <image class="neuron" xlink:href="/%20/img/n1.png">
            </image>
        </a>
        <image xlink:href="/%20/img/n3.png" x="99" y="643" width="42" height="127">
        </image>
        <image xlink:href="/%20/img/n2.png" x="87" y="778" width="41" height="298">
        </image>
    </svg>
</div>

<div id="loader" class="loader">
</div>

<script type="text/javascript">
    document.addEventListener('DOMContentLoaded', (event) => {
        let backgroundImage = document.getElementById("backgroundImage")
        //wait until the image has loaded to trigger animation
        backgroundImage.addEventListener("load", (event) => {
            const loader = document.getElementById('loader')
            window.setTimeout(() => {
                loader.addEventListener('animationend', (event) => {
                    console.log('animation ended')
                    loader.style.display = 'none'
                })
                loader.animate([
                    { opacity: 1 },
                    { opacity: 0 },
                ], {
                    duration: 1000,
                    easing: "ease-out",
                    iterations: 1,
                    fill: "forwards",
                })
                window.setTimeout(() => {
                    loader.style.display = 'none'
                }, 1000)
            }, 2000)
        })
        backgroundImage.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '/img/b2.png')
    })
</script>

<script type="text/javascript">
    let neuron = document.getElementsByClassName("neuron")
    let backgroundImage = document.getElementById("backgroundImage")

    let xScaling = backgroundImage.scrollWidth / 1662
    let yScaling = backgroundImage.scrollHeight / 1125

    let neuronPositions = [
        { x: 40, y: 3 },
        { x: 99, y: 643 },
        { x: 87, y: 778 },
    ]
    let neuronImages = [
        "/img/n1.png",
        "/img/n2.png",
        "/img/n3.png",
    ]

    let neuronSizes = [
        { width: 46, height: 126 },
        { width: 41, height: 298 },
        { width: 42, height: 127 },
    ]

    for (let i = 0; i < neuron.length; i++) {
        neuron[i].setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', neuronImages[i])
        neuron[i].setAttribute("x", neuronPositions[i].x * xScaling)
        neuron[i].setAttribute("y", neuronPositions[i].y * yScaling)
        neuron[i].setAttribute("width", neuronSizes[i].width * xScaling)
        neuron[i].setAttribute("height", neuronSizes[i].height * yScaling)
    }
</script>

    

</body>

</html>
